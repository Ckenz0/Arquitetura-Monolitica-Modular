          $ref: '#/components/responses/Erro403'
        '404':
          $ref: '#/components/responses/Erro404'
        '405':
          $ref: '#/components/responses/Erro405'
        '409':
          $ref: '#/components/responses/Erro409'
        '413':
          $ref: '#/components/responses/Erro413'
        '415':
          $ref: '#/components/responses/Erro415'
        '500':
          $ref: '#/components/responses/Erro500'
      security: []
components:
  securitySchemes:
    SessaoAnonima:
      type: http
      scheme: bearer
      description: Token anônimo assinado obtido em POST /api/sessoes; não é cadastro/login.
  schemas:
    Erro:
      type: object
      properties:
        erro:
          type: string
      required:
      - erro
    Sessao:
      type: object
      properties:
        token:
          type: string
        tipo:
          type: string
          const: Bearer
        expira_em_segundos:
          type: integer
          const: 86400
      required:
      - token
      - tipo
      - expira_em_segundos
    Avaliacao:
      type: object
      properties:
        id:
          type: string
        cliente:
          type: string
        nota:
          type: integer
          minimum: 1
          maximum: 5
        texto:
          type: string
        data:
          type: string
          format: date-time
      required:
      - id
      - cliente
      - nota
      - texto
      - data
    AvaliacaoIlustrativa:
      type: object
      properties:
        cliente:
          type: string
        texto:
          type: string
      required:
      - cliente
      - texto
      additionalProperties: false
    Livro:
      type: object
      properties:
        id:
          type: string
        titulo:
          type: string
        autor:
          type: string
        genero:
          type: string
        estoque:
          type: integer
          minimum: 0
        ano:
          type: integer
        lancamento:
          type: boolean
        preco:
          type: number
        codigo:
          type: string
        secao:
          type: string
        prateleira:
          type: string
        sinopse:
          type: string
        avaliacoes:
          type: array
          items:
            oneOf:
            - $ref: '#/components/schemas/Avaliacao'
            - $ref: '#/components/schemas/AvaliacaoIlustrativa'
        ja_avaliou:
          type: boolean
      required:
      - id
      - titulo
      - autor
      - genero
      - estoque
    Reserva:
      type: object
      properties:
        id:
          type: string
        cliente_id:
          type: string
        livro_id:
          type: string
        titulo:
          type: string
        prazo:
          type: string
          format: date-time
        embrulho:
          type: boolean
        status:
          type: string
          enum:
          - pendente
          - pronta
          - cancelada
      required:
      - id
      - cliente_id
      - livro_id
      - titulo
      - prazo
      - embrulho
      - status
    Preferencias:
      type: object
      properties:
        generos:
          type: array
          items:
            type: string
        temas_notificacao:
          type:
          - array
          - 'null'
          items:
            type: string
            enum:
            - estoque
            - reservas
            - fidelidade
            - eventos
      required:
      - generos
      - temas_notificacao
    Cliente:
      type: object
      properties:
        id:
          type: string
        generos:
          type: array
          items:
            type: string
        temas_notificacao:
          type:
          - array
          - 'null'
          items:
            type: string
      required:
      - id
      - generos
      - temas_notificacao
    Cupom:
      type: object
      properties:
        codigo:
          type: string
        termos:
          type: string
      required:
      - codigo
      - termos
    Fidelidade:
      type: object
      properties:
        saldo:
          type: integer
          minimum: 0
        cartao:
          type: object
          properties:
            cliente_id:
              type: string
            numero:
              type: string
          required:
          - cliente_id
          - numero
        cupons:
          type: array
          items:
            $ref: '#/components/schemas/Cupom'
      required:
      - saldo
      - cartao
      - cupons
    Horario:
      type: object
      properties:
        id:
          type: string
        livreiro:
          type: string
        quando:
          type: string
          format: date-time
        cliente_id:
          type:
          - string
          - 'null'
      required:
      - id
      - livreiro
      - quando
    Evento:
      type: object
      properties:
        id:
          type: string
        titulo:
          type: string
        quando:
          type: string
        local:
          type: string
        capacidade:
          type:
          - integer
          - 'null'
          minimum: 0
        lembrar_em:
          type:
          - string
          - 'null'
        inscrito:
          type: boolean
        vagas:
          type:
          - integer
          - 'null'
          minimum: 0
      required:
      - id
      - titulo
      - quando
      - local
      - capacidade
      - lembrar_em
      - inscrito
      - vagas
    Opiniao:
      type: object
      properties:
        cliente:
          type: string
        texto:
          type: string
      required:
      - cliente
      - texto
    Clube:
      type: object
      properties:
        id:
          type: string
        nome:
          type: string
        participando:
          type: boolean
        membros:
          type: integer
          minimum: 0
        opinioes:
          type: array
          items:
            $ref: '#/components/schemas/Opiniao'
      required:
      - id
      - nome
      - participando
      - membros
      - opinioes
    Compra:
      type: object
      properties:
        id:
          type: string
        livro:
          $ref: '#/components/schemas/Livro'
        pontos:
          type: integer
          minimum: 0
        data:
          type: string
        expira_em:
          type:
          - string
          - 'null'
        avisar_em:
          type:
          - string
          - 'null'
      required:
      - id
      - livro
      - pontos
      - data
      - expira_em
      - avisar_em
    Notificacao:
      type: object
      properties:
        id:
          type: string
        tema:
          type: string
        mensagem:
          type: string
        data:
          type: string
      required:
      - id
      - tema
      - mensagem
      - data
    Fila:
      type: object
      properties:
        posicao:
          type:
          - integer
          - 'null'
          minimum: 1
      required:
      - posicao
    Estado:
      type: object
      properties:
        cliente:
          $ref: '#/components/schemas/Cliente'
        livros:
          type: array
          items:
            $ref: '#/components/schemas/Livro'
        reservas:
          type: array
          items:
            $ref: '#/components/schemas/Reserva'
        fidelidade:
          $ref: '#/components/schemas/Fidelidade'
        loja:
          type: object
          properties:
            horario:
              type: string
            lotacao:
              type: integer
              minimum: 0
          required:
          - horario
          - lotacao
        fila:
          $ref: '#/components/schemas/Fila'
        horarios:
          type: array
          items:
            $ref: '#/components/schemas/Horario'
        agendamentos:
          type: array
          items:
            $ref: '#/components/schemas/Horario'
        eventos:
          type: array
          items:
            $ref: '#/components/schemas/Evento'
        clubes:
          type: array
          items:
            $ref: '#/components/schemas/Clube'
        desejos:
          type: array
          items:
            $ref: '#/components/schemas/Livro'
        historico:
          type: array
          items:
            $ref: '#/components/schemas/Compra'
        recomendacoes:
          type: array
          items:
            $ref: '#/components/schemas/Livro'
        notificacoes:
          type: array
          items:
            $ref: '#/components/schemas/Notificacao'
      required:
      - cliente
      - livros
      - reservas
      - fidelidade
      - loja
      - fila
      - horarios
      - agendamentos
      - eventos
      - clubes
      - desejos
      - historico
      - recomendacoes
      - notificacoes
  responses:
    Erro400:
      description: Entrada inválida.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    Erro401:
      description: Sessão ausente, inválida ou expirada.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    Erro403:
      description: Origem não permitida.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    Erro404:
      description: Recurso não encontrado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    Erro405:
      description: Método não permitido.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    Erro409:
      description: Conflito com o estado atual.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    Erro413:
      description: Corpo acima de 1 MiB.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    Erro415:
      description: Tipo de conteúdo inválido.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    Erro500:
      description: Erro interno sem detalhes privados.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
