      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nota:
                  type: integer
                  minimum: 1
                  maximum: 5
                texto:
                  type: string
                  minLength: 1
                  pattern: \S
              required:
              - nota
              - texto
              additionalProperties: false
      parameters:
