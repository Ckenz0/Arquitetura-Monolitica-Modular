openapi: 3.1.0
info:
  title: Entrelinhas — Monólito modular
  version: 1.0.0
  description: Aplicação única com seis módulos de negócio e frontend na mesma origem.
    Dados em memória, um processo com threads. Identificação anônima Bearer; sem login
    ou pagamentos.
servers:
- url: http://127.0.0.1:5000
  description: Aplicação única local.
security:
- SessaoAnonima: []
paths:
  /api/health:
    get:
      operationId: saude
      summary: saude
      description: JSON. Não repetir mutações automaticamente; consultar o estado
        antes de tentar novamente se a resposta se perder.
      responses:
        '200':
          description: Operação concluída.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    const: ok
                required:
                - status
        '400':
          $ref: '#/components/responses/Erro400'
        '401':
          $ref: '#/components/responses/Erro401'
        '403':
          $ref: '#/components/responses/Erro403'
        '404':
          $ref: '#/components/responses/Erro404'
        '405':
          $ref: '#/components/responses/Erro405'
        '409':
          $ref: '#/components/responses/Erro409'
        '413':
          $ref: '#/components/responses/Erro413'
        '415':
          $ref: '#/components/responses/Erro415'
        '500':
          $ref: '#/components/responses/Erro500'
      security: []
  /api/sessoes:
    post:
      operationId: criar_sessao_anonima
      summary: criar sessao anonima
      description: 'Cria identidade anônima, sem login, válida por 86400 segundos.
        Sem cookie; enviar token em Authorization: Bearer. Corpo ausente ou {}. Não
        recebe cliente_id. Reiniciar o backend remove dados em memória; a chave estável
        preserva a assinatura, mas não recupera os dados.'
      responses:
        '201':
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sessao'
        '400':
          $ref: '#/components/responses/Erro400'
        '401':
          $ref: '#/components/responses/Erro401'
        '403':
          $ref: '#/components/responses/Erro403'
        '404':
          $ref: '#/components/responses/Erro404'
        '405':
          $ref: '#/components/responses/Erro405'
        '409':
          $ref: '#/components/responses/Erro409'
        '413':
          $ref: '#/components/responses/Erro413'
        '415':
          $ref: '#/components/responses/Erro415'
        '500':
          $ref: '#/components/responses/Erro500'
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties: {}
              required: []
              additionalProperties: false
  /api/estado:
    get:
      operationId: consultar_estado
      summary: consultar estado
      description: Estado da sessão. Inclui lembretes processados no servidor, sem
        envio externo de mensagens.
      responses:
        '200':
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Estado'
        '400':
          $ref: '#/components/responses/Erro400'
        '401':
          $ref: '#/components/responses/Erro401'
        '403':
          $ref: '#/components/responses/Erro403'
        '404':
          $ref: '#/components/responses/Erro404'
        '405':
          $ref: '#/components/responses/Erro405'
        '409':
          $ref: '#/components/responses/Erro409'
        '413':
          $ref: '#/components/responses/Erro413'
        '415':
          $ref: '#/components/responses/Erro415'
        '500':
          $ref: '#/components/responses/Erro500'
  /api/livros:
