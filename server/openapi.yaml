        '409':
          $ref: '#/components/responses/Erro409'
        '413':
          $ref: '#/components/responses/Erro413'
        '415':
          $ref: '#/components/responses/Erro415'
        '500':
          $ref: '#/components/responses/Erro500'
      parameters:
      - name: q
        in: query
        schema:
          type: string
        description: Busca parcial por título ou autor, sem diferenciar caixa.
      - name: genero
        in: query
        schema:
          type: string
        description: Correspondência completa sem diferenciar caixa.
      - name: lancamentos
        in: query
        schema:
          type: string
        description: Use 1 para listar apenas lançamentos.
